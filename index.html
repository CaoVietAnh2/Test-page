<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Support Email Campaign Platform</title>
<meta name="description" content="A student project that helps customer support teams send appointment reminders and service emails to customers who have agreed to receive them.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #556070;
    --line: #d8dde5;
    --accent: #0b5c6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --surface: #1a2129;
      --ink: #e8ecf1;
      --muted: #a2adbb;
      --line: #2c3541;
      --accent: #6cc4d3;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 4rem 1.5rem 3rem;
  }
  h1 {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
  }
  h2 {
    font-size: 1.2rem;
    margin: 2.75rem 0 0.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
  }
  p { margin: 0 0 1rem; }
  .lead { font-size: 1.15rem; color: var(--muted); }
  ul { margin: 0 0 1rem; padding-left: 1.2rem; }
  li { margin-bottom: 0.4rem; }
  dl {
    margin: 1.25rem 0 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.25rem 1.1rem;
  }
  dl div { padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  dl div:last-child { border-bottom: 0; }
  dt { font-weight: 600; }
  dd { margin: 0.1rem 0 0; color: var(--muted); }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  footer {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
<main>
  <h1>Customer Support Email Campaign Platform</h1>


</footer>
</body>
</html>
